<svg width="1280" height="320" viewBox="0 0 1280 320"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Tejas Dixit - Backend Software Engineer">

  <!-- ===================== -->
  <!-- DEFINITIONS -->
  <!-- ===================== -->
  <defs>
    <!-- Smooth animated gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color"
                 values="#020617;#0f172a;#020617"
                 dur="14s"
                 repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f172a">
        <animate attributeName="stop-color"
                 values="#0f172a;#020617;#0f172a"
                 dur="14s"
                 repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cursor animation -->
    <style>
      .cursor {
        animation: blink 1.8s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- ===================== -->
  <!-- BACKGROUND -->
  <!-- ===================== -->
  <rect width="1280" height="320" fill="url(#bgGradient)" />

  <!-- ===================== -->
  <!-- CONTENT -->
  <!-- ===================== -->

  <!-- Name -->
  <text x="96" y="138"
        font-size="54"
        font-weight="700"
        fill="#e5e7eb"
        filter="url(#softGlow)"
        font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    Tejas Dixit
  </text>

  <!-- Role -->
  <text x="96" y="192"
        font-size="28"
        font-weight="500"
        fill="#c7d2fe"
        font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    Backend Software Engineer · Python · Flask · Automation Systems
  </text>

  <!-- Cursor underline -->
  <rect x="96" y="206"
        width="280"
        height="3"
        rx="2"
        fill="#60a5fa"
        class="cursor" />

  <!-- Tagline -->
  <text x="96" y="242"
        font-size="18"
        fill="#94a3b8"
        font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    Building reliable backend services and workflow automation tools
  </text>

</svg>

